name: ElevateBio
description: 'ElevateBio is an advanced therapies technology company and contract development
  and manufacturing organization (CDMO) for cell and gene therapies, headquartered in Waltham,
  Massachusetts. Through its BaseCamp cGMP manufacturing and process-development business
  and its centers of excellence, ElevateBio provides end-to-end capabilities spanning gene
  editing, viral vectors (AAV and lentivirus), mRNA and RNA therapeutics, induced pluripotent
  stem cells (iPSCs), analytical and process development, and regulatory CMC support, helping
  partners advance genetic medicines from concept through commercialization. Surfaced as a
  portfolio company of the SoftBank Vision Fund and profiled in the API Evangelist network,
  ElevateBio operates as a science- and manufacturing-driven organization rather than a
  public API provider; this profile captures its identity and domain security posture.'
